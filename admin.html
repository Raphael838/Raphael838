<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldwide Central FED - Admin</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0d1421;color:#fff;font-family:Arial;}
        .nav-bar{background:#1a2332;padding:15px 20px;border-bottom:2px solid #c62828;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .nav-title{color:#c62828;font-size:18px;font-weight:bold;letter-spacing:1px;}
        .nav-links{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;}
        .nav-links a{color:#888;text-decoration:none;font-size:13px;padding:8px 12px;border-radius:4px;border:1px solid transparent;}
        .nav-links a:hover,.nav-active{color:#c62828;border-color:#c62828;}
        .container{max-width:1200px;margin:0 auto;padding:20px;}
        .admin-header{text-align:center;margin:20px 0;padding:20px;background:#1a2332;border:2px solid #c62828;border-radius:8px;}
        .admin-title{color:#c62828;font-size:24px;font-weight:bold;}
        .card{background:#1a2332;padding:20px;border-radius:8px;border:1px solid #2a3441;margin-bottom:20px;}
        .card-title{color:#d4af37;font-size:16px;margin-bottom:15px;border-bottom:1px solid #2a3441;padding-bottom:10px;}
        .btn{background:#c62828;color:#fff;border:none;padding:12px 20px;border-radius:6px;font-weight:bold;cursor:pointer;margin:5px;}
        .btn-gold{background:#d4af37;color:#0d1421;}
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">WORLDWIDE CENTRAL FED</div>
        <div class="nav-links">
            <a href="admin.html" class="nav-active">FED Control</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="send.html">Send GD</a>
            <a href="receive.html">Receive GD</a>
            <a href="hpin-id.html">H-PIN ID</a>
            <a href="history.html">History</a>
            <a href="settings.html">Settings</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="admin-header">
            <div class="admin-title">SUPREME AUTHORITY CONTROL PANEL</div>
            <div style="color:#888;font-size:12px;margin-top:5px;">H-PIN: GEOG-ADMIN-OKI | Oki Raphael Efe</div>
        </div>

        <div class="card">
            <div class="card-title">H-PIN ISSUANCE</div>
            <div id="pendingList">Loading pending registrations...</div>
        </div>

        <div class="card">
            <div class="card-title">FED VAULT BALANCE</div>
            <div style="font-size:28px;color:#d4af37;" id="fedBalance">10,000,000,000,000,000,000,000,000,000,000 GD</div>
        </div>
    </div>

<script>
const userHPIN = localStorage.getItem('bog_hpin');
if(userHPIN !== 'GEOG-ADMIN-OKI') {
    alert('Access Denied, Sir. Admin credentials required.');
    location.href = 'index.html';
}

function loadPending() {
    let pending = JSON.parse(localStorage.getItem('bog_pending_registrations') || '[]');
    let html = '';
    
    if(pending.length === 0) {
        html = '<div style="color:#888;">No pending registrations, Sir.</div>';
    } else {
        pending.forEach((user, index) => {
            html += `
            <div style="background:#0d1421;padding:15px;border-radius:6px;margin-bottom:10px;border:1px solid #2a3441;">
                <div><strong>Name:</strong> ${user.name}</div>
                <div><strong>Email:</strong> ${user.email}</div>
                <div><strong>Reg Date:</strong> ${user.regDate}</div>
                <button class="btn btn-gold" onclick="issueHPIN('${user.email}', '${user.name}', ${index})">Issue H-PIN</button>
            </div>
            `;
        });
    }
    document.getElementById('pendingList').innerHTML = html;
}

function issueHPIN(email, name, index) {
    const hpin = 'GEOG-' + Math.random().toString(36).substr(2, 6).toUpperCase() + '-BOG';
    
    let userData = JSON.parse(localStorage.getItem('bog_user_' + email));
    userData.hpin = hpin;
    userData.status = 'ACTIVE';
    userData.issuedDate = new Date().toISOString();
    
    localStorage.setItem('bog_user_' + email, JSON.stringify(userData));
    localStorage.setItem('bog_hpin_issued_' + hpin, new Date().toISOString());
    localStorage.setItem('bog_profile_' + hpin, JSON.stringify({
        fullName: name,
        email: email,
        role: 'CITIZEN',
        regDate: userData.regDate
    }));
    localStorage.setItem('bal_' + hpin, '0');
    
    let pending = JSON.parse(localStorage.getItem('bog_pending_registrations') || '[]');
    pending.splice(index, 1);
    localStorage.setItem('bog_pending_registrations', JSON.stringify(pending));
    
    alert(`H-PIN Issued, Sir!\n\nName: ${name}\nEmail: ${email}\nH-PIN: ${hpin}`);
    loadPending();
}

function logout() {
    localStorage.removeItem('bog_user');
    localStorage.removeItem('bog_hpin');
    alert('Logged out of FED Control, Sir.');
    location.href = 'index.html';
}

window.onload = function() {
    loadPending();
    document.getElementById('fedBalance').textContent = 
        parseInt(localStorage.getItem('bal_GEOG-ADMIN-OKI') || '10000000000000000000000000000000').toLocaleString() + ' GD';
}
</script>
</body>
</html>
